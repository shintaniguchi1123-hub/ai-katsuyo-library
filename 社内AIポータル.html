<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>社内AIポータル（AI活用ライブラリー）</title>
<style>
  :root{
    --bg:#EAF1F9; --header-bg:#E6F1FF; --card:#FFFFFF;
    --text:#18293C; --muted:#8AA6C0; --line:#E3ECF6;
    --accent:#2B8CF0; --accent-deep:#1A6DC4; --accent-bg:#EAF3FD; --chip-active:#CFE2F8;
    --danger:#E0554F; --danger-bg:#FCEAE8;
    --font:'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;}
  button,input,textarea,select{font-family:inherit;}
  .shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:92px;}

  /* ---------- ログイン ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,var(--header-bg),var(--bg));}
  .login-card{background:var(--card);border-radius:20px;padding:32px 26px;width:100%;max-width:360px;box-shadow:0 4px 18px rgba(40,90,150,.12);}
  .login-title{font-size:20px;font-weight:800;margin:0 0 4px;text-align:center;}
  .login-sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;}
  .field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--accent-bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--text);}
  .field textarea{resize:vertical;min-height:60px;}
  .btn-primary{width:100%;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(43,140,240,.35);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .login-error{color:var(--danger);font-size:12px;text-align:center;margin:-6px 0 12px;}
  .notice{background:#FFF6E5;color:#8a6a1f;font-size:11px;border-radius:10px;padding:8px 12px;text-align:center;margin-bottom:16px;}
  details.demo{margin-top:18px;font-size:12px;color:var(--muted);}
  details.demo summary{cursor:pointer;font-weight:700;color:var(--accent-deep);}
  .demo-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px;}
  .demo-table th,.demo-table td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;}

  /* ---------- 共通ヘッダー ---------- */
  .topbar{background:var(--header-bg);padding:20px 20px 30px;position:relative;}
  .topbar .rowtop{display:flex;justify-content:space-between;align-items:flex-start;}
  .topbar h1{font-size:19px;margin:0 0 4px;}
  .topbar .sub{font-size:12px;color:var(--muted);margin:0;}
  .back-btn{background:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;box-shadow:0 1px 4px rgba(40,90,150,.12);}
  .logout-btn{background:rgba(255,255,255,.7);border:none;border-radius:999px;padding:7px 14px;font-size:12px;color:var(--accent-deep);font-weight:700;cursor:pointer;}
  .mini-notice{font-size:10.5px;color:var(--accent-deep);background:rgba(255,255,255,.6);display:inline-block;padding:3px 10px;border-radius:999px;margin-top:8px;}

  .searchbar{margin:-16px 20px 0;background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(40,90,150,.10);padding:2px;}
  .searchbar input{width:100%;border:none;background:transparent;padding:13px 16px;font-size:14px;border-radius:16px;}
  .searchbar input:focus{outline:none;}

  .chiprow{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 4px;scrollbar-width:thin;}
  .chiprow::-webkit-scrollbar{height:4px;}
  .chip{flex:0 0 auto;padding:8px 15px;border-radius:999px;background:#fff;color:var(--text);font-size:12.5px;white-space:nowrap;border:none;cursor:pointer;font-weight:600;}
  .chip.active{background:var(--accent);color:#fff;}
  .chip.store{background:var(--accent-bg);color:var(--accent-deep);}
  .chip.store.active{background:var(--chip-active);font-weight:800;}

  .new-banner{margin:10px 20px 0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-size:12.5px;font-weight:700;}

  .section{padding:18px 20px 4px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section-head .title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .section-head .title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}
  .section-head .count{font-size:12px;color:var(--muted);}

  .pinned-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px;}
  .pinned-card{background:#fff;border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 1px 4px rgba(40,90,150,.06);}
  .pinned-tag{font-size:10.5px;font-weight:800;color:var(--accent-deep);margin-bottom:6px;}
  .pinned-title{font-size:13px;font-weight:700;margin-bottom:8px;min-height:36px;}
  .pinned-cat{font-size:11px;color:var(--muted);}

  .sort-tabs{display:flex;gap:8px;padding:0 20px 12px;}
  .sort-tab{background:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:700;}
  .sort-tab.active{background:var(--text);color:#fff;}

  .post-card{background:#fff;border-radius:16px;margin:0 20px 12px;padding:16px;cursor:pointer;box-shadow:0 1px 4px rgba(40,90,150,.06);}
  .post-title{font-size:15px;font-weight:800;margin:0 0 10px;}
  .post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .cat-chip{background:var(--accent-bg);color:var(--accent-deep);font-size:11px;padding:4px 10px;border-radius:999px;font-weight:700;}
  .store-tag{font-size:11px;color:var(--muted);}
  .author-tag{font-size:11.5px;color:var(--muted);}
  .sample-badge{background:#FFE9C7;color:#8a5a10;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;margin-left:4px;}
  .divider{border-top:1px dashed var(--line);margin:8px 0;}
  .post-footer{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;}

  /* ---------- 詳細 ---------- */
  .detail-title{font-size:18px;font-weight:800;margin:14px 20px 8px;}
  .detail-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 20px 16px;font-size:12px;color:var(--muted);}
  .step-card{background:#fff;border-radius:16px;padding:16px;margin:0 20px 10px;display:flex;gap:12px;box-shadow:0 1px 4px rgba(40,90,150,.05);}
  .step-card.hi{background:var(--accent-bg);}
  .step-num{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:0 0 auto;}
  .step-num.hi{background:var(--accent);color:#fff;}
  .step-body .label{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px;}
  .step-body .val{font-size:13.5px;}

  .block{background:#fff;border-radius:16px;padding:16px;margin:0 20px 12px;box-shadow:0 1px 4px rgba(40,90,150,.05);}
  .block h3{font-size:13.5px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .prompt-box{background:var(--accent-bg);border-radius:12px;padding:12px 14px;font-size:12.5px;white-space:pre-wrap;color:var(--text);}
  .btn-copy{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;}

  .photo-row{display:flex;gap:8px;flex-wrap:wrap;}
  .photo-row img{width:84px;height:84px;object-fit:cover;border-radius:10px;}
  .photo-thumb{position:relative;}
  .photo-remove{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;}

  .reaction-row{display:flex;gap:8px;}
  .reaction-btn{flex:1;background:#fff;border:1.5px solid var(--accent-bg);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;}
  .reaction-btn .n{display:block;font-size:15px;font-weight:800;margin-top:2px;}
  .reaction-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .btn-outline{width:100%;background:#fff;border:1.5px solid var(--accent);color:var(--accent-deep);border-radius:999px;padding:11px;font-size:13.5px;font-weight:800;cursor:pointer;margin-top:10px;}
  .btn-outline.saved{background:var(--accent);color:#fff;}
  .edit-row{display:flex;gap:8px;margin:10px 20px 0;}
  .btn-small{flex:1;border:none;border-radius:999px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .btn-small.edit{background:var(--accent-bg);color:var(--accent-deep);}
  .btn-small.delete{background:var(--danger-bg);color:var(--danger);}

  .qa-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .qa-item:last-child{border-bottom:none;}
  .qa-q{font-size:13px;margin-bottom:4px;}
  .qa-q .who{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;}
  .qa-a{background:var(--accent-bg);border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:6px;}
  .qa-a .who{font-size:11px;color:var(--accent-deep);font-weight:700;display:block;margin-bottom:2px;}
  .ask-row{display:flex;gap:8px;margin-top:12px;}
  .ask-row input{flex:1;border:1px solid var(--line);background:var(--accent-bg);border-radius:999px;padding:10px 14px;font-size:12.5px;}
  .ask-row button{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:0 16px;font-size:12.5px;font-weight:800;cursor:pointer;}
  .answer-row{display:flex;gap:6px;margin-top:6px;}
  .answer-row input{flex:1;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:11.5px;}
  .answer-row button{background:var(--accent-deep);color:#fff;border:none;border-radius:999px;padding:0 12px;font-size:11.5px;cursor:pointer;}

  .related-item{display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;border-bottom:1px solid var(--line);cursor:pointer;}
  .related-item:last-child{border-bottom:none;}
  .related-item .v{color:var(--muted);font-size:11.5px;}

  /* ---------- フォーム ---------- */
  .form-close{background:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;position:absolute;left:20px;top:18px;}
  .form-head{text-align:center;font-size:16px;font-weight:800;padding:22px 60px 26px;background:var(--header-bg);position:relative;}
  .step-input-row{display:flex;gap:10px;margin-bottom:12px;}
  .step-input-row .num{width:22px;height:22px;border-radius:50%;background:var(--accent-bg);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:0 0 auto;margin-top:6px;}
  .step-input-row .field{flex:1;margin-bottom:0;}
  .add-cat-btn{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:#fff;border:1px dashed var(--accent);color:var(--accent-deep);font-size:12px;font-weight:700;cursor:pointer;}
  .add-cat-box{display:flex;gap:8px;margin-top:10px;}
  .add-cat-box input{flex:1;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;}
  .add-cat-box button{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:0 14px;font-size:12px;font-weight:800;cursor:pointer;}
  .photo-add{width:64px;height:64px;border-radius:10px;background:var(--accent-bg);border:1px dashed var(--accent);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;position:relative;overflow:hidden;}
  .photo-add input{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent-deep);margin-bottom:14px;}
  .form-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px;}

  /* ---------- カテゴリ一覧 ---------- */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 20px;}
  .cat-tile{background:#fff;border-radius:16px;padding:20px 16px;cursor:pointer;box-shadow:0 1px 4px rgba(40,90,150,.06);}
  .cat-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-bg);margin-bottom:14px;}
  .cat-tile .name{font-size:14px;font-weight:800;margin-bottom:6px;}
  .cat-tile .cnt{font-size:11.5px;color:var(--muted);}

  /* ---------- 集計 ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px;}
  .stat-tile{border-radius:16px;padding:18px;}
  .stat-tile.fill{background:var(--accent);color:#fff;}
  .stat-tile.line{background:#fff;box-shadow:0 1px 4px rgba(40,90,150,.06);}
  .stat-tile .label{font-size:12px;font-weight:700;opacity:.85;margin-bottom:8px;}
  .stat-tile .num{font-size:28px;font-weight:800;}
  .rank-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .rank-item:last-child{border-bottom:none;}
  .rank-num{width:20px;height:20px;border-radius:50%;background:var(--accent-bg);color:var(--accent-deep);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .rank-title{font-size:12.5px;flex:1;}
  .rank-sub{font-size:11px;color:var(--muted);}
  .bar-row{margin-bottom:10px;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;}
  .bar-bg{background:var(--accent-bg);border-radius:999px;height:8px;overflow:hidden;}
  .bar-fill{background:var(--accent);height:100%;border-radius:999px;}

  /* ---------- マイページ ---------- */
  .profile-card{background:#fff;border-radius:16px;margin:0 20px 14px;padding:18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(40,90,150,.06);}
  .profile-card .name{font-size:15px;font-weight:800;}
  .profile-card .role{font-size:12px;color:var(--muted);margin-top:2px;}
  .stats-link{background:#fff;border-radius:14px;margin:0 20px 16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;cursor:pointer;box-shadow:0 1px 4px rgba(40,90,150,.06);}

  /* ---------- ボトムナビ ---------- */
  .bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:#fff;box-shadow:0 -2px 10px rgba(40,90,150,.08);display:flex;align-items:center;padding:8px 10px 12px;z-index:20;}
  .nav-item{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:700;padding:4px;}
  .nav-item .icon{font-size:19px;}
  .nav-item.active{color:var(--accent-deep);}
  .nav-fab{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px rgba(43,140,240,.4);margin:-24px 6px 0;flex:0 0 auto;}

  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:12.5px;padding:10px 18px;border-radius:999px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  .toast.error{background:var(--danger);}

  /* ---------- 管理画面 ---------- */
  .field select{width:100%;border:1px solid var(--line);background:var(--accent-bg);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--text);}
  .form-error{color:var(--danger);font-size:12px;text-align:center;min-height:18px;margin:-4px 0 10px;}
  .admin-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
  .admin-row:last-child{border-bottom:none;}
  .admin-row .main{flex:1;min-width:0;}
  .admin-row .name{font-size:13.5px;font-weight:800;}
  .admin-row .sub{font-size:11.5px;color:var(--muted);word-break:break-all;}
  .admin-row button{flex:0 0 auto;background:var(--accent-bg);color:var(--accent-deep);border:none;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .status-off{background:var(--danger-bg);color:var(--danger);font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:4px;}
  .status-wait{background:#FFF6E5;color:#8a6a1f;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:4px;}
  .edit-box{background:var(--accent-bg);border-radius:12px;padding:14px;margin:6px 0 10px;}
  .edit-box .field input,.edit-box .field select{background:#fff;}
  .btn-row{display:flex;gap:8px;}
  .btn-row button{flex:1;}
  .btn-gray{background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .pw-gen{display:flex;gap:8px;}
  .pw-gen input{flex:1;}
  .pw-gen button{flex:0 0 auto;background:#fff;border:1px dashed var(--accent);color:var(--accent-deep);border-radius:12px;padding:0 12px;font-size:12px;font-weight:700;cursor:pointer;}
  .issued{background:#FFF6E5;border-radius:12px;padding:14px;margin:0 20px 12px;font-size:13px;}
  .issued b{font-family:Consolas,monospace;font-size:14px;}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:80px 20px;}
</style>
</head>
<body>
<div id="app"><div class="loading">読み込み中…</div></div>

<script>
/* ============ サーバーとのやりとり ============ */
/* データとログインは Cloudflare（functions/api と D1 データベース）で管理する */
async function api(method, path, body){
  const opt = {method, headers:{}, credentials:'same-origin'};
  if(method!=='GET'){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body||{}); }
  let res;
  try{ res = await fetch('/api'+path, opt); }
  catch(e){ throw new Error('通信できませんでした。電波の状態を確認してください'); }
  const out = await res.json().catch(()=>({}));
  if(res.status===401 && path!=='/login'){ data=null; ui.screen='login'; render(); }
  if(!res.ok) throw new Error(out.error || 'エラーが起きました');
  return out;
}

let data = null;
let ui = {
  screen:'loading', postId:null, editingId:null,
  sort:'new', catFilter:'all', storeFilter:'all', query:'',
  homeBanner:false, formDraft:null, busy:false,
  adminUsers:null, adminEditing:null, issued:null
};

async function refresh(){ data = await api('GET','/data'); }

async function boot(){
  try{
    const st = await api('GET','/status');
    if(st.setupNeeded){ ui.screen='setup'; render(); return; }
    await refresh();
    if(data.me.mustChange){ ui.screen='changepw'; render(); return; }
    goHome();
  }catch(e){
    if(ui.screen==='loading'){ ui.screen='login'; render(); }
  }
}

/* 連打防止つきで操作を実行する */
async function run(fn){
  if(ui.busy) return;
  ui.busy = true;
  try{ await fn(); }
  catch(e){ showError(e.message); }
  finally{ ui.busy = false; }
}

function showToast(text, isError){
  const old = document.querySelector('.toast'); if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'+(isError?' error':''); el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), isError?3500:1800);
}
function showError(text){
  const el = document.getElementById('form-error');
  if(el) el.textContent = text; else showToast(text, true);
}

/* ============ 便利関数 ============ */
function me(){ return data ? data.me : null; }
function storeName(id){ if(!id) return '本部'; const s = data.stores.find(s=>s.id===id); return s ? s.name : '本部'; }
function findPost(id){ return data.posts.find(p=>p.id===id); }
function findCategory(id){ return data.categories.find(c=>c.id===id); }
function authorName(post){ if(!post.authorId) return '見本'; return accountName(post.authorId); }
function accountName(id){ const a = data.accounts.find(a=>a.id===id); return a ? a.name : '（削除されたアカウント）'; }
function roleName(r){ return r==='admin'?'経営サイド':r==='manager'?'店長':'社員'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ const d=new Date(ts); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function val(id){ const el=document.getElementById(id); return el ? el.value : ''; }

/* ============ 画面遷移 ============ */
function goHome(){
  const user = me();
  if(user){

function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1000;
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.75));
      };
      img.onerror = () => reject(new Error('この写真は読み込めませんでした'));
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function onPhotoSelected(inputEl){

  if(remain<=0){ inputEl.value=''; return; }
  const files = Array.from(inputEl.files).slice(0, remain);
  Promise.all(files.map(resizeImage)).then(results=>{
    ui.formDraft.photos.push(...results);

  }).catch(e=>showToast(e.message, true));
}

function filteredPosts(){
  let list = data.posts.slice();
  if(ui.catFilter!=='all') list = list.filter(p=>p.categoryId===ui.catFilter);
  if(ui.storeFilter!=='all') list = list.filter(p=>p.storeId===ui.storeFilter);
  const q = ui.query.trim();
  if(q) list = list.filter(p=>(p.title+' '+p.prompt+' '+Object.values(p.steps).join(' ')).includes(q));
  if(ui.sort==='new') list.sort((a,b)=>b.createdAt-a.createdAt);
  else if(ui.sort==='helpful') list.sort((a,b)=>reactionTotal(b)-reactionTotal(a));
  else if(ui.sort==='views') list.sort((a,b)=>b.views-a.views);
  return list;
}
function reactionTotal(p){ return p.reactions.like.length + p.reactions.tried.length + p.reactions.mimic.length; }

/* ============ 集計 ============ */
function computeStats(){
  const now = new Date();
  const monthPosts = data.posts.filter(p=>{
    const d = new Date(p.createdAt);
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  });
  const topViewed = data.posts.slice().sort((a,b)=>b.views-a.views).slice(0,3);
  const byCategory = data.categories.map(c=>({name:c.name, count:data.posts.filter(p=>p.categoryId===c.id).length}));
  const byStore = data.stores.map(s=>({name:s.name, count:data.posts.filter(p=>p.storeId===s.id).length}));
  return {monthCount:monthPosts.length, totalCount:data.posts.length, topViewed, byCategory, byStore};
}

const app = document.getElementById('app');

function render(){
  const active = document.activeElement;
  const focusInfo = (active && active.id) ? {id:active.id, start:active.selectionStart, end:active.selectionEnd} : null;

  app.innerHTML = buildScreen();

  if(focusInfo){
    const el = document.getElementById(focusInfo.id);
    if(el){
      el.focus();
      if(el.setSelectionRange && focusInfo.start!=null){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

  const related = data.posts.filter(p=>p.categoryId===post.categoryId && p.id!==post.id).sort((a,b)=>b.views-a.views).slice(0,3);
  const relatedHtml = related.length ? '<div class="block"><h3>同じカテゴリのお手本</h3>'
    + related.map(p=>'<div class="related-item" onclick="openDetail(\''+p.id+'\')"><span>'+esc(p.title)+'</span><span class="v">閲覧 '+p.views+'</span></div>').join('')
    + '</div>' : '';

  const editRow = canEdit(post) ? '<div class="edit-row"><button class="btn-small edit" onclick="openEditForm(\''+post.id+'\')">編集する</button><button class="btn-small delete" onclick="deletePost(\''+post.id+'\')">削除する</button></div>' : '';

  return '<div class="topbar"><button class="back-btn" onclick="goHome()">←</button></div>'
    + '<div class="detail-title">'+esc(post.title)+(post.isSample?' <span class="sample-badge">見本</span>':'')+'</div>'
    + '<div class="detail-meta"><span class="cat-chip">'+esc(cat?cat.name:'')+'</span><span>'+esc(storeName(post.storeId))+'</span><span>'+esc(authorName(post))+'</span><span>閲覧 '+post.views+'</span></div>'
    + stepsHtml
    + '<div class="block"><h3>使ったプロンプト<button class="btn-copy" onclick="copyPrompt(\''+post.id+'\')">コピーする</button></h3><div class="prompt-box">'+esc(post.prompt||'（未入力）')+'</div></div>'
    + photosHtml
    + reactionsHtml
    + '<div style="padding:0 20px;"><button class="btn-outline '+(isSaved(post.id)?'saved':'')+'" onclick="toggleSaved(\''+post.id+'\')">'+(isSaved(post.id)?'保存済み':'保存する')+'</button></div>'
    + editRow
    + qaHtml
    + relatedHtml;
}

function renderForm(){
  const user = me();
  const draft = ui.formDraft;
  const catChips = data.categories.map(c=>
    '<button class="chip '+(draft.categoryId===c.id?'active':'')+'" onclick="setFormCategory(\''+c.id+'\')" type="button">'+esc(c.name)+'</button>'
  ).join('');
  const addCatUi = user.role==='admin' ? (
    '<button class="add-cat-btn" type="button" onclick="toggleAddCategory()">＋ 新しいカテゴリを追加</button>'
    + (draft.showAddCategory ? '<div class="add-cat-box"><input id="new-category-input" type="text" placeholder="カテゴリ名"><button type="button" onclick="addCategory()">追加</button></div>' : '')
  ) : '';

  const stepFields = [
    ['want','①  やりたかったこと'], ['cant','②  できなかったこと'], ['why','③  なぜできなかったか'],
    ['result','④  出てきた結果'], ['fix','⑤  その対策']
  ];
  const stepsHtml = stepFields.map(([key,label])=>
    '<div class="field"><label>'+label+'</label><textarea id="step-'+key+'-input" oninput="onStepInput(\''+key+'\',this.value)">'+esc(draft.steps[key])+'</textarea></div>'
  ).join('');

  const photosHtml = '<div class="photo-row">'
    + draft.photos.map((p,i)=>'<div class="photo-thumb"><img src="'+esc(p)+'"><button class="photo-remove" onclick="removePhoto('+i+')">×</button></div>').join('')
    + (draft.photos.length<3 ? '<div class="photo-add">＋<input type="file" accept="image/*" onchange="onPhotoSelected(this)"></div>' : '')
    + '</div>';

  const pinUi = user.role==='admin'
    ? '<div class="checkbox-row"><input type="checkbox" id="pin-checkbox" '+(draft.pinned?'checked':'')+' onchange="togglePinDraft()"><label for="pin-checkbox">この投稿を「おすすめ」に固定する</label></div>'
    : '';

  return '<div class="form-head">'+(ui.editingId?'お手本を編集する':'お手本を投稿する')+'<button class="form-close" onclick="closeForm()">×</button></div>'
    + '<div style="padding:20px;">'
    + '<div class="field"><label>タイトル</label><input id="title-input" type="text" placeholder="ひと目で分かる題名を書く" value="'+esc(draft.title||'')+'" oninput="onTitleInput(this.value)"></div>'
    + '<div class="field"><label>カテゴリ</label><div class="chiprow" style="padding:4px 0;">'+catChips+'</div>'+addCatUi+'</div>'
    + '<div class="field"><label>5項目</label></div>'
    + stepsHtml
    + '<div class="field"><label>使ったプロンプト</label><textarea id="prompt-input" oninput="onPromptInput(this.value)">'+esc(draft.prompt)+'</textarea></div>'
    + '<div class="field"><label>写真（最大3枚）</label>'+photosHtml+'</div>'
    + pinUi
    + '<button class="btn-primary" onclick="submitForm()">'+(ui.editingId?'更新する':'投稿する')+'</button>'
    + '<div class="form-hint">'+(draft.showError?'<span style="color:var(--danger);">タイトルとカテゴリを入れてください</span>':'タイトルとカテゴリを入れると投稿できます')+'</div>'
    + '</div>';
}

function renderCategories(){
  return '<div class="topbar"><button class="back-btn" onclick="goHome()">←</button><h1 style="margin-top:10px;">カテゴリ</h1><p class="sub">仕事の種類からさがす</p></div>'
    + '<div class="cat-grid">' + data.categories.map(c=>{
      const count = data.posts.filter(p=>p.categoryId===c.id).length;
      return '<div class="cat-tile" onclick="openCategoryFilter(\''+c.id+'\')"><div class="cat-icon"></div><div class="name">'+esc(c.name)+'</div><div class="cnt">お手本 '+count+'件</div></div>';
    }).join('') + '</div>';
}

function renderStats(){
  if(me().role!=='admin') return renderHome();
  const s = computeStats();
  const maxStoreCount = Math.max(1, ...s.byStore.map(x=>x.count));
  return '<div class="topbar"><button class="back-btn" onclick="goMyPage()">←</button><h1 style="margin-top:10px;">集計</h1><p class="sub">経営サイドのみ表示</p></div>'
    + '<div class="stat-grid">'
    + '<div class="stat-tile fill"><div class="label">今月の投稿数</div><div class="num">'+s.monthCount+'</div></div>'
    + '<div class="stat-tile line"><div class="label">累計の投稿数</div><div class="num">'+s.totalCount+'</div></div>'
    + '</div>'
    + '<div class="block"><h3>よく見られたお手本</h3>'
    + s.topViewed.map((p,i)=>'<div class="rank-item"><div class="rank-num">'+(i+1)+'</div><div class="rank-title">'+esc(p.title)+'</div><div class="rank-sub">閲覧 '+p.views+'／いいね '+p.reactions.like.length+'</div></div>').join('')
    + '</div>'
    + '<div class="block"><h3>カテゴリ別の投稿数</h3>'
    + s.byCategory.map(c=>'<div class="rank-item"><div class="rank-title">'+esc(c.name)+'</div><div class="rank-sub">'+c.count+'件</div></div>').join('')
    + '</div>'
    + '<div class="block"><h3>店舗別の投稿数</h3>'
    + s.byStore.map(st=>'<div class="bar-row"><div class="top"><span>'+esc(st.name)+'</span><span>'+st.count+'件</span></div><div class="bar-bg"><div class="bar-fill" style="width:'+(st.count/maxStoreCount*100)+'%;"></div></div></div>').join('')
    + '</div>';
}

function renderSaved(){
  const posts = data.posts.filter(p=>isSaved(p.id));
  return '<div class="topbar"><h1>保存したお手本</h1><p class="sub">'+posts.length+'件</p></div>'
    + (posts.length ? posts.map(postCard).join('') : '<div class="empty">まだ保存したお手本はありません</div>');
}

function renderMyPage(){
  const user = me();
  const myPosts = data.posts.filter(p=>p.authorId===user.id);
  return '<div class="topbar"><h1>マイページ</h1></div>'
    + '<div class="profile-card"><div><div class="name">'+esc(user.name)+'</div><div class="role">'+esc(storeName(user.storeId))+'／'+roleName(user.role)+'／ID：'+esc(user.loginId)+'</div></div><button class="logout-btn" onclick="logout()">出る</button></div>'
    + (user.role==='admin' ? '<div class="stats-link" onclick="goStats()">集計を見る（経営サイド向け）<span>→</span></div>'
      + '<div class="stats-link" onclick="goAdmin()">アカウント・店舗の管理<span>→</span></div>' : '')
    + '<div class="stats-link" onclick="goChangePw()">パスワードを変更する<span>→</span></div>'
    + '<div class="section"><div class="section-head"><div class="title">自分の投稿</div><div class="count">'+myPosts.length+'件</div></div></div>'
    + (myPosts.length ? myPosts.map(postCard).join('') : '<div class="empty">まだ投稿がありません</div>');
}

function storeOptions(selected){
  return data.stores.map(s=>'<option value="'+esc(s.id)+'" '+(s.id===selected?'selected':'')+'>'+esc(s.name)+'</option>').join('');
}
function roleOptions(selected){
  return ['staff','manager','admin'].map(r=>'<option value="'+r+'" '+(r===selected?'selected':'')+'>'+roleName(r)+'</option>').join('');
}

function renderAdmin(){
  if(me().role!=='admin') return renderHome();
  const issued = ui.issued ? '<div class="issued">'
    + (ui.issued.reset?'パスワードを再発行しました。':'アカウントを作りました。')+'次の内容を<strong>'+esc(ui.issued.name)+'</strong> さんに伝えてください。<br>'
    + 'ID：<b>'+esc(ui.issued.loginId)+'</b><br>パスワード：<b>'+esc(ui.issued.password)+'</b><br>'
    + '<span style="font-size:11.5px;color:#8a6a1f;">この画面を閉じると、パスワードはもう表示されません。最初のログインのときに、本人が新しいパスワードに変更します。</span></div>' : '';

  const users = ui.adminUsers;
  const userRows = !users ? '<div class="empty">読み込み中…</div>' : users.map(u=>{
    const badges = (u.active?'':'<span class="status-off">利用停止</span>') + (u.active && u.mustChange?'<span class="status-wait">初回ログイン前</span>':'');
    const row = '<div class="admin-row"><div class="main"><div class="name">'+esc(u.name)+badges+'</div>'
      + '<div class="sub">ID：'+esc(u.loginId)+'／'+roleName(u.role)+(u.role!=='admin'?'／'+esc(storeName(u.storeId)):'')+'</div></div>'
      + '<button onclick="startEditUser(\''+u.id+'\')">'+(ui.adminEditing===u.id?'閉じる':'変更')+'</button></div>';
    if(ui.adminEditing!==u.id) return row;
    return row + '<div class="edit-box">'
      + '<div class="field"><label>名前</label><input id="eu-name" type="text" value="'+esc(u.name)+'"></div>'
      + '<div class="field"><label>役割</label><select id="eu-role">'+roleOptions(u.role)+'</select></div>'
      + '<div class="field"><label>店舗（経営サイドは不要）</label><select id="eu-store">'+storeOptions(u.storeId)+'</select></div>'
      + '<div class="field"><label>パスワードの再発行（忘れたときだけ）</label><div class="pw-gen"><input id="eu-pw" type="text" autocomplete="off" placeholder="空のままなら変更しません"><button type="button" onclick="genPassword(\'eu-pw\')">自動で作る</button></div></div>'
      + '<div class="checkbox-row"><input type="checkbox" id="eu-active" '+(u.active?'checked':'')+'><label for="eu-active">このアカウントを使えるようにする（外すと利用停止）</label></div>'
      + '<button class="btn-primary" onclick="saveUser(\''+u.id+'\')">保存する</button>'
      + '</div>';
  }).join('');

  const storeRows = data.stores.map(s=>'<div class="admin-row"><div class="main"><div class="name">'+esc(s.name)+'</div></div><button onclick="renameStore(\''+s.id+'\')">名前を変更</button></div>').join('');

  return '<div class="topbar"><button class="back-btn" onclick="goMyPage()">←</button><h1 style="margin-top:10px;">アカウント・店舗の管理</h1><p class="sub">経営サイドのみ表示</p></div>'
    + '<div style="height:14px;"></div>'
    + issued
    + '<div class="block"><h3>アカウントを追加する</h3>'
    + '<div class="field"><label>ID（半角英数字。ログインに使います）</label><input id="nu-id" type="text" autocapitalize="off" autocomplete="off" placeholder="例：shibuya-yamada"></div>'
    + '<div class="field"><label>名前（画面に表示されます）</label><input id="nu-name" type="text" placeholder="例：渋谷店 山田"></div>'
    + '<div class="field"><label>役割</label><select id="nu-role">'+roleOptions('staff')+'</select></div>'
    + '<div class="field"><label>店舗（経営サイドは不要）</label><select id="nu-store">'+storeOptions(null)+'</select></div>'
    + '<div class="field"><label>最初のパスワード（8文字以上）</label><div class="pw-gen"><input id="nu-pw" type="text" autocomplete="off"><button type="button" onclick="genPassword(\'nu-pw\')">自動で作る</button></div></div>'
    + '<button class="btn-primary" onclick="addUser()">追加する</button>'
    + '</div>'
    + '<div class="block"><h3>アカウント一覧（'+(users?users.length:0)+'人）</h3>'+userRows+'</div>'
    + '<div class="block"><h3>店舗</h3>'+storeRows
    + '<div class="add-cat-box"><input id="new-store-input" type="text" placeholder="追加する店舗名"><button type="button" onclick="addStore()">追加</button></div>'
    + '</div>';
}

/* ============ 起動 ============ */
boot();
</script>
</body>
</html>
